<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Câu cá ôn bài – Tổng quan & Câu hỏi nghiên cứu</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎣</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sky-top:#8fd3e6; --sky-bot:#fde7c4;
  --grass:#6aa84f; --grass-dark:#4d8a38;
  --water:#2a8fa8; --water-deep:#0f4c5c;
  --wood:#9c6b3f; --wood-dark:#6e4726;
  --ink:#1d2b33; --paper:#fffaf0;
  --good:#2f9e5b; --bad:#d64545;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--water-deep);font-family:var(--body);color:var(--ink)}
button{font-family:inherit}
button:focus-visible{outline:3px solid #ffd23f;outline-offset:3px}

#scene{position:fixed;inset:0;overflow:hidden;
  background:linear-gradient(var(--sky-top),var(--sky-bot) 30%);user-select:none}
.sun{position:absolute;top:6%;right:14%;width:80px;height:80px;border-radius:50%;
  background:radial-gradient(#fff6c9,#ffd25e 60%,#ffb347);box-shadow:0 0 60px 20px rgba(255,210,94,.45)}
.cloud{position:absolute;height:28px;background:#fff;border-radius:30px;opacity:.9;animation:drift 60s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:40px;height:40px;top:-20px;left:18px}
.cloud::after{width:30px;height:30px;top:-14px;left:48px}
.c1{width:110px;top:9%;left:-120px}
.c2{width:90px;top:17%;left:-120px;animation-duration:85s;animation-delay:-40s}
@keyframes drift{to{transform:translateX(calc(100vw + 260px))}}

.shore{position:absolute;left:0;right:0;top:29%;height:9%;
  background:linear-gradient(var(--grass),var(--grass-dark))}
.reeds{position:absolute;bottom:64%;right:22%;display:flex;gap:6px;align-items:flex-end}
.reeds i{display:block;width:4px;background:#3f7a2e;border-radius:3px}
.reeds i::after{content:"";display:block;width:8px;height:22px;margin-left:-2px;background:#7a4b2a;border-radius:6px}

#pond{position:absolute;left:0;right:0;top:36%;bottom:0;
  background:linear-gradient(var(--water) 0%,#1f7690 45%,var(--water-deep) 100%)}
.wave{position:absolute;left:0;right:0;top:calc(36% - 10px);height:12px;
  background:radial-gradient(circle at 20px -6px,transparent 14px,var(--water) 15px) repeat-x;
  background-size:40px 12px;animation:wave 6s linear infinite}
@keyframes wave{to{background-position:40px 0}}
.bubble{position:absolute;bottom:-20px;width:10px;height:10px;border-radius:50%;
  border:2px solid rgba(255,255,255,.35);animation:rise 9s linear infinite}
@keyframes rise{to{transform:translateY(-58vh);opacity:0}}

#scenery,#lineSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#lineSvg{z-index:6}
#fishLayer{position:absolute;inset:0;z-index:5;pointer-events:none}

.fish{position:absolute;left:0;top:0;will-change:transform}
.fish .flip{width:100%;height:100%}
.fish svg{width:100%;height:100%;display:block;overflow:visible}
.fish.hooked svg{animation:wiggle .18s ease-in-out infinite alternate}
@keyframes wiggle{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.fish .num{position:absolute;left:50%;top:-8px;transform:translateX(-50%);
  font:800 13px/1 var(--display);color:#fff;background:rgba(15,76,92,.8);
  padding:3px 7px 2px;border-radius:10px}

/* Basket */
#basket{position:absolute;z-index:4;width:150px;text-align:center}
#basket .label{font:700 16px/1.1 var(--display);color:var(--ink);background:var(--paper);
  display:inline-block;padding:4px 12px 2px;border-radius:12px;margin-bottom:6px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
#basket .weave{position:relative;height:74px;border-radius:10px 10px 40px 40px;
  background:
    repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 3px,transparent 3px 14px),
    repeating-linear-gradient(0deg,#c9954f 0 9px,#b07c3c 9px 18px);
  border:4px solid var(--wood-dark);border-top-width:8px;
  display:flex;flex-wrap:wrap-reverse;align-content:flex-start;justify-content:center;gap:0 2px;padding:4px 8px;overflow:hidden}
#basket .weave svg{width:30px;height:18px}
#basket.bump .weave{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.08)}}

/* HUD */
.hud{position:absolute;z-index:8;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);
  text-align:center;width:min(560px,94vw);pointer-events:none}
.hud h1{margin:0;font:800 clamp(20px,3.4vw,30px)/1.05 var(--display);color:var(--water-deep);
  text-shadow:0 2px 0 rgba(255,255,255,.6)}
.hud p{margin:2px 0 6px;font-size:13px;color:#2f4a55}
.stats{display:inline-flex;gap:8px}
.stats span{background:rgba(255,250,240,.85);border-radius:10px;padding:3px 10px;font:600 13px/1.4 var(--body)}

#castBtn{position:absolute;z-index:8;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  font:800 22px/1 var(--display);padding:14px 30px 11px;border:none;border-radius:40px;cursor:pointer;
  background:#ffd23f;color:var(--ink);box-shadow:0 6px 0 #c99a00,0 10px 24px rgba(0,0,0,.25);transition:transform .1s}
#castBtn:hover{transform:translateX(-50%) translateY(-2px)}
#castBtn:active{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 #c99a00}
#castBtn:disabled{filter:grayscale(.6) brightness(.9);cursor:not-allowed;transform:translateX(-50%)}

#toast{position:absolute;z-index:9;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  background:var(--paper);padding:10px 18px;border-radius:14px;font-weight:600;font-size:15px;max-width:90vw;text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,.25);opacity:0;transition:.3s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{color:var(--bad)} #toast.good{color:var(--good)}

.splash{position:absolute;z-index:4;pointer-events:none}
.splash i{position:absolute;left:0;top:0;border:3px solid rgba(255,255,255,.8);border-radius:50%;
  transform:translate(-50%,-50%);animation:ring .9s ease-out forwards}
.splash i:nth-child(2){animation-delay:.15s}
.splash b{position:absolute;width:7px;height:7px;background:#dff6ff;border-radius:50%;animation:drop .7s ease-out forwards}
@keyframes ring{from{width:10px;height:5px;opacity:1}to{width:120px;height:34px;opacity:0}}
@keyframes drop{to{transform:translate(var(--dx),var(--dy));opacity:0}}

/* Big fish question modal */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  padding:16px;background:rgba(8,40,52,.55);backdrop-filter:blur(3px);overflow-y:auto}
.overlay.hidden{display:none}
.bigfish{--fc:#ff8a5b;display:flex;align-items:center;width:min(800px,100%);margin:auto;animation:swimIn .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes swimIn{from{transform:translateX(-40px) scale(.4);opacity:0}}
.bigfish .tail{flex:0 0 90px;height:170px;margin-right:-26px;background:var(--fc);filter:brightness(.88);
  clip-path:polygon(0 0,100% 42%,100% 58%,0 100%,24% 50%);animation:flap .6s ease-in-out infinite alternate;transform-origin:right center}
@keyframes flap{to{transform:scaleY(.8) rotate(4deg)}}
.bigfish .body{flex:1;position:relative;background:radial-gradient(ellipse at 40% 30%,rgba(255,255,255,.35),transparent 55%),var(--fc);
  border-radius:44% 56% 56% 44% / 50%;padding:52px 92px 52px 56px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.bigfish .body::before{content:"";position:absolute;top:-34px;left:36%;width:110px;height:60px;background:var(--fc);
  filter:brightness(.88);clip-path:polygon(0 100%,40% 0,100% 100%);z-index:-1}
.bigfish .eye{position:absolute;right:7%;top:22%;width:34px;height:34px;border-radius:50%;background:#fff;
  box-shadow:inset -9px 0 0 3px #1d2b33}
.bigfish .gill{position:absolute;right:20%;top:24%;bottom:24%;width:20px;border-right:4px solid rgba(0,0,0,.15);border-radius:0 50% 50% 0}
.belly{position:relative;background:var(--paper);border-radius:34px;padding:22px 26px 20px;
  box-shadow:inset 0 3px 0 rgba(0,0,0,.06);animation:bellyOpen .45s .2s both}
@keyframes bellyOpen{from{transform:scale(.2);opacity:0}}
.qtag{font:700 14px/1 var(--display);color:#6b5a45}
.belly h2{margin:6px 0 14px;font:700 clamp(18px,2.4vw,22px)/1.3 var(--display);color:var(--ink)}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;margin:0 0 8px;padding:10px 12px;
  border:2px solid #eadfc9;background:#fff;border-radius:14px;font-size:15px;line-height:1.4;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--water);background:#f1fbfd}
.opt .k{flex:0 0 26px;height:26px;border-radius:50%;background:#eadfc9;font:800 14px/27px var(--display);text-align:center}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:#e7f7ec}.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:#fdecec;animation:shake .4s}.opt.wrong .k{background:var(--bad);color:#fff}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#feedback{font-size:15px;line-height:1.45;margin-top:4px;min-height:0}
#feedback.good{color:#1f6d3f}#feedback.bad{color:var(--bad);font-weight:600}
#toBasket{display:none;margin:12px auto 0;font:800 18px/1 var(--display);padding:12px 22px 9px;border:none;border-radius:30px;
  background:var(--good);color:#fff;cursor:pointer;box-shadow:0 4px 0 #1f6d3f}
#toBasket.show{display:block}

/* Win */
.win{background:var(--paper);border-radius:28px;padding:30px 28px;text-align:center;max-width:440px;animation:swimIn .5s}
.win h2{font:800 32px/1.1 var(--display);margin:6px 0 8px;color:var(--water-deep)}
.win p{margin:0 0 18px;line-height:1.5}
.win button{font:800 20px/1 var(--display);padding:13px 28px 10px;border:none;border-radius:30px;background:#ffd23f;cursor:pointer;box-shadow:0 5px 0 #c99a00}
.win .big{font-size:56px}

@media (max-width:640px){
  .bigfish .tail{flex-basis:34px;height:90px;margin-right:-10px}
  .bigfish .body{border-radius:36px;padding:34px 14px 16px}
  .bigfish .body::before{width:70px;height:40px;top:-24px}
  .bigfish .eye{width:22px;height:22px;top:8px;right:22px;box-shadow:inset -6px 0 0 2px #1d2b33}
  .bigfish .gill{display:none}
  .belly{padding:16px 14px;border-radius:24px}
  .opt{font-size:14px}
  #basket{width:108px}
  #basket .weave{height:58px}
  #basket .weave svg{width:22px;height:14px}
  .hud p{display:none}
  .sun{width:54px;height:54px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>
<div id="scene">
  <div class="sun"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div>
  <div class="shore"><div class="reeds"><i style="height:40px"></i><i style="height:56px"></i><i style="height:34px"></i></div></div>
  <div id="pond"></div>
  <div class="wave"></div>
  <svg id="scenery"></svg>
  <div id="basket"><div class="label">Rổ cá: <span id="basketCount">0</span>/10</div><div class="weave" id="weave"></div></div>
  <div id="fishLayer"></div>
  <svg id="lineSvg"><path id="line" fill="none" stroke="#f5f5f5" stroke-width="1.6"/><g id="hook"></g></svg>

  <div class="hud">
    <h1>Câu cá ôn bài</h1>
    <p>Tổng quan nghiên cứu · Khoảng trống · Câu hỏi nghiên cứu</p>
    <div class="stats"><span>Lượt câu: <b id="castCount">0</b>/10</span><span>Trả lời sai: <b id="wrongCount">0</b></span></div>
  </div>
  <button id="castBtn">🎣 Bắt đầu câu</button>
  <div id="toast"></div>
</div>

<div class="overlay hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="qText">
  <div class="bigfish" id="bigfish">
    <div class="tail"></div>
    <div class="body">
      <div class="gill"></div><div class="eye"></div>
      <div class="belly">
        <div class="qtag" id="qTag"></div>
        <h2 id="qText"></h2>
        <div id="opts"></div>
        <div id="feedback"></div>
        <button id="toBasket">Cho cá vào rổ 🧺</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay hidden" id="winModal">
  <div class="win">
    <div class="big" id="winIcon">🧺🐟</div>
    <h2 id="winTitle">Rổ đầy rồi!</h2>
    <p id="winText"></p>
    <button id="replayBtn">Chơi lại</button>
  </div>
</div>

<script>
const QUESTIONS = [
  { sec:"Mục 2.1.1", q:"Loại tổng quan nào dùng phương pháp thống kê để tổng hợp định lượng kết quả của nhiều nghiên cứu?",
    a:"Phân tích gộp (Meta-analysis)",
    w:["Tổng quan tường thuật (Narrative review)","Tổng quan phạm vi (Scoping review)","Tổng quan hệ thống (Systematic review)"],
    ex:"Phân tích gộp dùng thống kê để gộp kết quả định lượng của nhiều nghiên cứu; tổng quan hệ thống thì nhấn mạnh quy trình tìm kiếm, sàng lọc có thể lặp lại." },
  { sec:"Mục 2.1.1", q:"Điểm khác biệt cốt lõi giữa tổng quan nghiên cứu và việc liệt kê tài liệu là gì?",
    a:"Tổng quan đặt các công trình trong mối quan hệ với nhau: thống nhất hay mâu thuẫn, vì sao khác biệt, còn khoảng trống nào",
    w:["Tổng quan tóm tắt từng tài liệu theo thứ tự thời gian công bố","Tổng quan chỉ sử dụng tài liệu nước ngoài","Tổng quan chỉ chọn nghiên cứu ủng hộ giả thuyết của người viết"],
    ex:"Liệt kê chỉ cho biết “tác giả A nghiên cứu gì”. Tổng quan phải so sánh, lý giải khác biệt và dẫn tới khoảng trống nghiên cứu." },
  { sec:"Mục 2.2.1", q:"Đặc điểm nào sau đây thuộc về trường phái Thực chứng (Positivism)?",
    a:"Xuất phát từ triết học Auguste Comte, coi hiện thực là khách quan và gắn với kiểm định giả thuyết (deductive)",
    w:["Coi hiện thực được cấu thành từ trải nghiệm cá nhân, ưu tiên phỏng vấn sâu","Lấy hiệu quả giải quyết vấn đề làm thước đo trung tâm, kết hợp định tính và định lượng","Không sử dụng hồi quy, SEM hay chuỗi thời gian"],
    ex:"Thực chứng giả định hiện thực tồn tại khách quan, thường kiểm định giả thuyết bằng hồi quy, SEM, chuỗi thời gian. Hạn chế: dễ bỏ qua bối cảnh tâm lý con người." },
  { sec:"Mục 2.2.2", q:"Nhóm nhân tố nào đóng vai trò cầu nối, làm tăng hoặc giảm cường độ tác động của biến độc lập lên biến mục tiêu?",
    a:"Nhân tố trung gian và điều tiết",
    w:["Nhân tố nội tại","Nhân tố bên ngoài","Bối cảnh chính sách và thể chế"],
    ex:"Biến trung gian truyền tải tác động, biến điều tiết làm mạnh hoặc yếu mối quan hệ giữa biến độc lập và biến phụ thuộc." },
  { sec:"Mục 2.2.5", q:"Mô hình lý thuyết xây dựng ở châu Âu, Mỹ khi áp dụng nguyên mẫu vào Việt Nam bộc lộ điểm không tương thích. Đây là khoảng trống gì?",
    a:"Khoảng trống bối cảnh (Contextual Gap)",
    w:["Khoảng trống phương pháp (Methodological Gap)","Khoảng trống thời gian (Temporal Gap)","Khoảng trống biến số"],
    ex:"Khoảng trống bối cảnh: đã nghiên cứu ở quốc gia/thị trường khác nhưng chưa được kiểm chứng trong bối cảnh của mình." },
  { sec:"Mục 2.3.2", q:"Theo kỹ thuật đọc hiệu quả, bước đầu tiên khi tiếp cận một tài liệu là gì?",
    a:"Đọc tiêu đề và phần tóm tắt để quyết định có đọc tiếp hay không",
    w:["Đọc toàn văn, bao gồm phương pháp và kết quả chi tiết","Đọc phần giới thiệu và kết luận","Đọc danh mục tài liệu tham khảo"],
    ex:"Trình tự: tiêu đề + tóm tắt → giới thiệu + kết luận → chỉ đọc toàn văn với tài liệu thật sự liên quan chặt chẽ." },
  { sec:"Mục 2.3.3 · Case Adidas", q:"Trong case study áo thun Adidas, nghiên cứu của Pratiwi & Ardani (2021) cho thấy hình ảnh thương hiệu đóng vai trò gì?",
    a:"Biến trung gian truyền tác động từ quốc gia xuất xứ đến ý định mua",
    w:["Biến phụ thuộc của mô hình","Biến điều tiết giữa lối sống và ý định mua","Không có tác động đáng kể đến ý định mua"],
    ex:"Pratiwi & Ardani (2021) kiểm định mô hình trung gian: quốc gia xuất xứ → hình ảnh thương hiệu → ý định mua." },
  { sec:"Mục 2.4.3", q:"Chuỗi logic nào đúng khi đi từ vấn đề đến câu hỏi nghiên cứu?",
    a:"Vấn đề → Tổng quan tài liệu → Khoảng trống → Câu hỏi nghiên cứu → Mục tiêu → Giả thuyết",
    w:["Câu hỏi nghiên cứu → Vấn đề → Giả thuyết → Tổng quan → Khoảng trống","Vấn đề → Mục tiêu → Giả thuyết → Tổng quan → Khoảng trống","Tổng quan → Giả thuyết → Vấn đề → Câu hỏi nghiên cứu → Khoảng trống"],
    ex:"Phạm vi thu hẹp dần: vấn đề rộng → tổng quan → gap (điều gì chưa biết) → RQ (cần trả lời gì) → mục tiêu (sẽ làm gì)." },
  { sec:"Mục 2.4.2", q:"“Có mối quan hệ nào giữa văn hóa doanh nghiệp và ý định nghỉ việc của nhân viên?” thuộc loại câu hỏi nghiên cứu nào?",
    a:"Câu hỏi quan hệ/tương quan (Relational)",
    w:["Câu hỏi mô tả (Descriptive)","Câu hỏi so sánh (Comparative)","Câu hỏi dự báo (Predictive)"],
    ex:"Câu hỏi quan hệ/tương quan tìm hiểu mối liên hệ giữa hai hay nhiều biến." },
  { sec:"Mục 2.4.4", q:"Trong bộ tiêu chí FINER, chữ “N” có nghĩa là gì?",
    a:"Novel – mới mẻ, có đóng góp khác biệt, gắn với khoảng trống",
    w:["Necessary – cần thiết cho doanh nghiệp","Numerical – đo lường được bằng số liệu","Neutral – trung lập về quan điểm"],
    ex:"FINER = Feasible, Interesting, Novel, Ethical, Relevant. Novel gắn trực tiếp với Gap đã xác định." }
];
const COLORS=["#ff8a5b","#ffcf56","#7bd389","#5bc0eb","#c38dff","#ff6b9a","#f4a259","#4ecdc4","#ffb4a2","#9bb1ff"];

const MAX_CASTS=10;
const $=id=>document.getElementById(id);
const scene=$("scene"),fishLayer=$("fishLayer"),castBtn=$("castBtn"),lineEl=$("line"),hookEl=$("hook");
let W,H,pondTop,tip,idleHook,hook,fishes=[],busy=false,casts=0,wrongs=0,caught=0,fishW,fishH;

function fishSVG(c){
  return `<svg viewBox="0 0 100 60" aria-hidden="true">
  <path d="M22 30 L2 10 Q9 30 2 50 Z" fill="${c}" style="filter:brightness(.85)"/>
  <path d="M42 12 Q56 -2 72 11 Z" fill="${c}" style="filter:brightness(.85)"/>
  <ellipse cx="56" cy="30" rx="40" ry="22" fill="${c}"/>
  <ellipse cx="58" cy="38" rx="27" ry="11" fill="#fff" opacity=".45"/>
  <path d="M42 15 Q49 30 42 45" stroke="rgba(0,0,0,.16)" stroke-width="3" fill="none"/>
  <circle cx="80" cy="25" r="5.5" fill="#fff"/><circle cx="82" cy="25" r="2.8" fill="#1d2b33"/>
  <path d="M93 32 Q89 34.5 92.5 37" stroke="#1d2b33" fill="none" stroke-width="1.8" stroke-linecap="round"/></svg>`;
}
const rand=(a,b)=>a+Math.random()*(b-a);
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function tween(d,fn){return new Promise(res=>{const s=performance.now();
  (function step(n){const t=Math.min(1,(n-s)/d);fn(t);t<1?requestAnimationFrame(step):res();})(s);});}

function layout(){
  const r=scene.getBoundingClientRect();W=r.width;H=r.height;pondTop=H*0.36;
  fishW=Math.max(64,Math.min(104,W*0.075));fishH=fishW*0.6;
  const dockW=Math.max(90,W*0.2), sx=dockW*0.45;
  tip={x:sx+Math.max(120,W*0.17),y:Math.max(pondTop-H*0.25,110)};
  idleHook={x:tip.x,y:pondTop+46};
  if(!busy||!hook) hook={...idleHook};
  const d=pondTop-14;
  $("scenery").innerHTML=`
    <rect x="${dockW*0.2}" y="${d}" width="8" height="46" fill="${getVar('--wood-dark')}"/>
    <rect x="${dockW*0.8}" y="${d}" width="8" height="46" fill="${getVar('--wood-dark')}"/>
    <rect x="-4" y="${d}" width="${dockW}" height="13" rx="3" fill="${getVar('--wood')}"/>
    <path d="M${sx-4} ${d} q2 20 -6 30 M${sx+6} ${d} q4 20 0 30" stroke="#35506b" stroke-width="7" stroke-linecap="round" fill="none"/>
    <rect x="${sx-13}" y="${d-36}" width="26" height="38" rx="10" fill="#e76f51"/>
    <circle cx="${sx}" cy="${d-46}" r="11" fill="#f1c27d"/>
    <path d="M${sx-20} ${d-50} L${sx+20} ${d-50} L${sx} ${d-70} Z" fill="#e9c46a" stroke="#b8923a" stroke-width="2"/>
    <path d="M${sx+8} ${d-20} Q${(sx+tip.x)/2} ${tip.y+30} ${tip.x} ${tip.y}" stroke="${getVar('--wood-dark')}" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="${sx+10}" cy="${d-20}" r="5" fill="#f1c27d"/>`;
  const b=$("basket"),bw=b.offsetWidth,bh=b.offsetHeight;
  b.style.left=(W-bw-Math.max(12,W*0.03))+"px";b.style.top=(pondTop-bh+14)+"px";
  fishes.forEach(f=>{if(f.state==="swim"){f.x=Math.min(f.x,W-fishW);f.y=clampY(f.y);}});
}
function getVar(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function clampY(y){const min=pondTop+30,max=Math.max(min+10,H-fishH-90);return Math.min(max,Math.max(min,y));}

function drawLine(){
  const mx=(tip.x+hook.x)/2, my=Math.max(tip.y,hook.y)-(hook.y-tip.y)*0.35+20;
  lineEl.setAttribute("d",`M${tip.x} ${tip.y} Q${mx} ${my} ${hook.x} ${hook.y-6}`);
  const x=hook.x,y=hook.y;
  hookEl.innerHTML=`<g transform="translate(${x},${y-40})"><ellipse cx="0" cy="0" rx="6" ry="8" fill="#fff"/><path d="M-6 0 A6 8 0 0 1 6 0 Z" fill="#e63946"/></g>
    <path d="M${x} ${y-8} L${x} ${y+6} Q${x} ${y+13} ${x-6} ${y+10}" stroke="#d9d9d9" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
}

function makeFish(i){
  const el=document.createElement("div");el.className="fish";
  el.style.width=fishW+"px";el.style.height=fishH+"px";
  el.innerHTML=`<div class="flip">${fishSVG(COLORS[i])}</div><span class="num">${i+1}</span>`;
  fishLayer.appendChild(el);
  const dir=Math.random()<.5?1:-1;
  return {i,el,flip:el.firstChild,x:rand(0,W-fishW),y:clampY(rand(pondTop+30,H)),vx:dir*rand(28,62),dir,t:rand(0,9),freq:rand(1,2.2),s:1,state:"swim"};
}
function applyFish(f){
  f.el.style.transform=`translate(${f.x}px,${f.y}px) scale(${f.s})`;
  f.flip.style.transform=`scaleX(${f.dir})`;
}
const mouth=f=>({x:f.dir===1?f.x+fishW*0.95:f.x+fishW*0.05,y:f.y+fishH*0.55});

let last=performance.now();
function tick(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  for(const f of fishes){
    if(f.state==="swim"){
      f.t+=dt;
      if(Math.random()<.004)f.vx=(Math.random()<.5?1:-1)*rand(28,62);
      f.x+=f.vx*dt;f.y+=Math.sin(f.t*f.freq)*14*dt;
      if(f.x<0){f.x=0;f.vx=Math.abs(f.vx)}
      if(f.x>W-fishW){f.x=W-fishW;f.vx=-Math.abs(f.vx)}
      f.y=clampY(f.y);f.dir=f.vx>=0?1:-1;
    }
    if(f.state!=="caught")applyFish(f);
  }
  drawLine();requestAnimationFrame(tick);
}

function toast(msg,cls){const t=$("toast");t.textContent=msg;t.className="show "+(cls||"");
  clearTimeout(toast.h);toast.h=setTimeout(()=>t.className="",3200);}

function splash(x){
  const s=document.createElement("div");s.className="splash";s.style.left=x+"px";s.style.top=pondTop+"px";
  let h="<i></i><i></i>";for(let k=0;k<7;k++)h+=`<b style="--dx:${rand(-50,50)}px;--dy:${rand(-60,-20)}px"></b>`;
  s.innerHTML=h;scene.appendChild(s);setTimeout(()=>s.remove(),1000);
}

async function cast(){
  const pool=fishes.filter(f=>f.state==="swim");
  if(busy||!pool.length)return;
  busy=true;castBtn.disabled=true;casts++;$("castCount").textContent=casts;
  const f=pool[Math.floor(Math.random()*pool.length)];
  f.state="wait";
  const from={...hook},to=mouth(f);
  await tween(1100,t=>{const e=ease(t);hook.x=lerp(from.x,to.x,e);hook.y=lerp(from.y,to.y,e)});
  f.el.classList.add("hooked");splash(to.x);
  await sleep(350);
  const up={x:tip.x+8,y:tip.y+95},off=f.dir===1?fishW*0.95:fishW*0.05;
  await tween(900,t=>{const e=ease(t);hook.x=lerp(to.x,up.x,e);hook.y=lerp(to.y,up.y,e);
    f.x=hook.x-off;f.y=hook.y-fishH*0.55;});
  showQuestion(f);
}

function showQuestion(f){
  const q=QUESTIONS[f.i];
  $("bigfish").style.setProperty("--fc",COLORS[f.i]);
  $("qTag").textContent=`Cá số ${f.i+1} · ${q.sec}`;
  $("qText").textContent=q.q;
  const opts=[{t:q.a,ok:true},...q.w.map(t=>({t,ok:false}))].sort(()=>Math.random()-.5);
  const box=$("opts");box.innerHTML="";
  opts.forEach((o,k)=>{
    const b=document.createElement("button");b.className="opt";
    b.innerHTML=`<span class="k">${"ABCD"[k]}</span><span></span>`;b.lastChild.textContent=o.t;
    b.onclick=()=>answer(f,o.ok,b,q);box.appendChild(b);
  });
  const fb=$("feedback");fb.textContent="";fb.className="";
  $("toBasket").className="";
  const m=$("modal");m.classList.remove("hidden");
  const bf=$("bigfish");bf.style.animation="none";bf.offsetHeight;bf.style.animation="";
  box.firstChild.focus({preventScroll:true});
}

function answer(f,ok,btn,q){
  document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
  const fb=$("feedback");
  if(ok){
    btn.classList.add("right");fb.className="good";fb.textContent="✅ Chính xác! "+q.ex;
    const tb=$("toBasket");tb.className="show";tb.focus();
    tb.onclick=()=>{$("modal").classList.add("hidden");catchFish(f);};
  }else{
    btn.classList.add("wrong");fb.className="bad";fb.textContent="❌ Chưa đúng! Cá vùng vẫy tuột khỏi lưỡi câu…";
    wrongs++;$("wrongCount").textContent=wrongs;
    setTimeout(()=>{$("modal").classList.add("hidden");releaseFish(f);},1300);
  }
}

function hookBack(){const from={...hook};
  return tween(600,t=>{const e=ease(t);hook.x=lerp(from.x,idleHook.x,e);hook.y=lerp(from.y,idleHook.y,e)});}

async function catchFish(f){
  f.el.classList.remove("hooked");f.state="flying";
  const b=$("basket"),tx=b.offsetLeft+b.offsetWidth/2-fishW/2,ty=b.offsetTop+b.offsetHeight-fishH-20;
  const sx=f.x,sy=f.y;
  hookBack();
  await tween(850,t=>{const e=ease(t);f.x=lerp(sx,tx,e);f.y=lerp(sy,ty,e)-Math.sin(Math.PI*t)*110;f.s=1-0.6*e;});
  f.state="caught";f.el.style.display="none";caught++;
  const icon=document.createElement("span");icon.innerHTML=fishSVG(COLORS[f.i]);$("weave").appendChild(icon.firstChild);
  $("basketCount").textContent=caught;b.classList.remove("bump");b.offsetWidth;b.classList.add("bump");
  busy=false;
  if(caught===QUESTIONS.length||casts>=MAX_CASTS){castBtn.disabled=true;setTimeout(showWin,600);}
  else{castBtn.disabled=false;castBtn.textContent="🎣 Câu tiếp";toast(`Đã cho cá số ${f.i+1} vào rổ! Còn ${MAX_CASTS-casts} lượt câu.`,"good");}
}

async function releaseFish(f){
  f.el.classList.remove("hooked");f.state="flying";
  const sx=f.x,sy=f.y,tx=Math.min(W-fishW,Math.max(0,sx+rand(-160,160))),ty=clampY(pondTop+rand(50,160));
  hookBack();let splashed=false;
  await tween(1000,t=>{f.x=lerp(sx,tx,t);f.y=lerp(sy,ty,t*t)-Math.sin(Math.PI*t)*120;
    if(!splashed&&f.y>pondTop-fishH*0.3&&t>.4){splashed=true;splash(f.x+fishW/2);}});
  f.vx=(tx>sx?1:-1)*rand(40,70);f.state="swim";
  busy=false;
  if(casts>=MAX_CASTS){castBtn.disabled=true;setTimeout(showWin,600);return;}
  castBtn.disabled=false;castBtn.textContent="🎣 Câu lại";
  toast(`Cá số ${f.i+1} đã nhảy về hồ. Còn ${MAX_CASTS-casts} lượt câu!`,"bad");
}

function showWin(){
  const n=QUESTIONS.length;
  let title,icon,note;
  if(caught===n){title="Rổ đầy rồi!";icon="🧺🐟🏆";note="Xuất sắc, bạn nắm chắc toàn bộ nội dung!";}
  else if(caught>=7){title="Hết lượt câu!";icon="🧺🐟";note="Rất tốt, ôn lại vài mục còn sót là ổn.";}
  else if(caught>=4){title="Hết lượt câu!";icon="🧺";note="Khá ổn, nên xem lại các phần trả lời sai.";}
  else{title="Hết lượt câu!";icon="🎣";note="Cần ôn thêm, hãy đọc lại dàn ý rồi chơi lại nhé.";}
  $("winTitle").textContent=title;$("winIcon").textContent=icon;
  $("winText").innerHTML=`Sau <b>${casts}</b> lượt câu, bạn câu được <b>${caught}/${n}</b> con cá (trả lời sai <b>${wrongs}</b> lần).<br>${note}`;
  $("winModal").classList.remove("hidden");$("replayBtn").focus();
}

function reset(){
  fishLayer.innerHTML="";$("weave").innerHTML="";
  casts=wrongs=caught=0;busy=false;
  $("castCount").textContent=0;$("wrongCount").textContent=0;$("basketCount").textContent=0;
  castBtn.disabled=false;castBtn.textContent="🎣 Bắt đầu câu";
  hook={...idleHook};
  fishes=QUESTIONS.map((_,i)=>makeFish(i));
  $("winModal").classList.add("hidden");
}

// bubbles
for(let k=0;k<8;k++){const b=document.createElement("div");b.className="bubble";
  b.style.left=rand(5,95)+"%";b.style.animationDelay=(-rand(0,9))+"s";b.style.animationDuration=rand(7,12)+"s";$("pond").appendChild(b);}

castBtn.onclick=cast;
$("replayBtn").onclick=reset;
window.addEventListener("resize",layout);
layout();reset();requestAnimationFrame(tick);
</script>
</body>
</html>
